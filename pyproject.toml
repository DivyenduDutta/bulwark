[project]
name = "bulwark"
version = "0.1.0"
description = "Wrapper and some rewrite of RobStatTM R package. Inspired from GSoC 2026 proposal"
readme = "README.md"
authors = [
    { name = "Divyendu Dutta", email = "connect2divyendu@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "jupyterlab>=4.6.6",
    "numpy>=2.2.6",
    "rpy2>=3.6.9",
]

[project.scripts]
bulwark = "bulwark:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mkdocstrings-python>=2.0.9",
    "nbconvert>=7.17.2",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "ty>=0.0.107",
    "zensical>=0.0.67",
    "pre-commit>=4.6.2"
]
