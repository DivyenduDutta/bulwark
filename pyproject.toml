[project]
name = "bulwark"
version = "0.1.0"
description = "Wrapper and some rewrite of RobStatTM R package. Inspired from GSoC 2026 proposal"
readme = "README.md"
authors = [
    { name = "Divyendu Dutta", email = "connect2divyendu@gmail.com" }
]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
bulwark = "bulwark:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mkdocstrings-python>=2.0.9",
    "nbconvert>=7.17.2",
    "zensical>=0.0.67",
]
