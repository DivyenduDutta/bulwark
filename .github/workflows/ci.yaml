name: CI

on:
  push: # this triggers on push events on all branches
  pull_request:
    branches: [ master ]

jobs:
  ci-checks:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false  # let all OSes finish even if one fails
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0

      - name: Set PYTHONPATH
        shell: bash
        run: |
          echo "PYTHONPATH=$PYTHONPATH:/home/bulwark" >> $GITHUB_ENV

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # Install a specific version of uv.
          version: "0.12.9"

      - name: Set up Python
        run: uv python install

      - name : Create virtual environment
        run : uv venv

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Run pre-commit (linting/formatting/type checking)
        if: matrix.os == 'ubuntu-latest'  # same result on every OS, so run once
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Run tests (CI-safe only)
        run: uv run pytest -m runonci
